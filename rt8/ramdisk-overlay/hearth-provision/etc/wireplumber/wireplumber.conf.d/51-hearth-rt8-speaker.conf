# RT8: the mt6789-mt6366 speaker path (DL1 -> I2S3 -> aw883xx amps) is 16-bit;
# WirePlumber/PipeWire otherwise opens the sink as S32LE and the extra bits come
# out as loud static. Force S16LE (and keep it from suspending mid-stream).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-soc_sound.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        api.alsa.period-size = 1024
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
