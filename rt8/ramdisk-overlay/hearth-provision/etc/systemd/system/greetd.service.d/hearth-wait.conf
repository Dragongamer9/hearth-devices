# Hearth RT8: the greeter is labwc on Droidian's hwcomposer backend, which needs
# the Android container up and the host-side APEX libraries (bionic libc for
# libhybris) mounted. Without ordering, greetd starts during early boot, labwc
# segfaults because none of that exists yet, and greetd burns its 5-try start
# limit and gives up seconds before the container finishes -- leaving a black
# screen even though the stack comes good moments later.
#
# Order it after the container and the host-APEX mount, and remove the start
# limit so that if it still loses the race it keeps retrying (every 2s) until
# the compositor can come up, instead of quitting for good.
[Unit]
After=lxc@android.service hearth-host-apex.service
Wants=hearth-host-apex.service
StartLimitIntervalSec=0

[Service]
RestartSec=2
