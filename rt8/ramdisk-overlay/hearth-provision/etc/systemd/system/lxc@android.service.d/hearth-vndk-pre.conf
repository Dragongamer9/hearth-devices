# Hearth RT8 (Droidian): the vendor was built against VNDK v31, but the system
# image only ships v34, so the container's bootstrap linkerconfig aborts
# ("VNDK APEX /apex/com.android.vndk.v31 not found", SANITIZER_DEFAULT_VENDOR
# undefined) unless the stock v31 APEX is staged first. hearth-vndk-apex.service
# does that staging, but on the lxc@android path systemd deletes its job to
# break an ordering cycle (it is After=android-mount and Before=sysinit.target,
# which android-mount already orders after). Run it here as a pre-step instead,
# right before the container, where the cycle can't apply. '-' so a failure can
# never stop the container from starting; the script is idempotent and best
# effort.
[Service]
ExecStartPre=-/usr/bin/python3 /usr/libexec/hearth/vndk-apex
