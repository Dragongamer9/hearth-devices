[Service]
# Hearth (RT8): libhybris in the Lomiri compositor first tries to load the
# MediaTek HWC HAL in-process. hwcomposer.mtk_common.so opens /dev/dri/card0
# as soon as it loads and keeps DRM master even after the HWC1 open fails, so
# the real composer service (vendor.hwcomposer-2-3) can never commit a frame.
# Hide the file from this service only; the compositor then goes straight to
# libhwc2_compat_layer and the composer service, and the Android container
# still sees the real file.
BindReadOnlyPaths=-/dev/null:/android/vendor/lib64/hw/hwcomposer.mtk_common.so
