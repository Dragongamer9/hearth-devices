# Hearth RT8: mount every APEX of the system image under its plain name
# (/android/apex/<name>), not just runtime/art/i18n/vndk. Without this the
# container's /apex/com.android.conscrypt, statsd, media... paths are
# missing and their services exit 127.
[Service]
ExecStart=
ExecStart=/usr/libexec/lxc-android-config/mount-apexes.py
