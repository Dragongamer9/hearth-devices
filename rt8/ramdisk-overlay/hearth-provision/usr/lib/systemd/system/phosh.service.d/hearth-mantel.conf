# Run Hearth Mantel (labwc/phoc + the Hearth shell) instead of phosh. If the
# Mantel scripts aren't there (an older boot image's provisioning replaces
# /usr/libexec/hearth at every boot), start stock phosh: the screen must
# always come up. mantel-session itself also falls back to phosh.
[Service]
ExecStart=
ExecStart=capsh --noamb -- -c "[ -x /usr/libexec/hearth/mantel-session ] && exec /usr/libexec/hearth/mantel-session; exec /usr/bin/phosh-session"
