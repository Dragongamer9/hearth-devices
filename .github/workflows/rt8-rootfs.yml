name: RT8 rootfs

# The Hearth rootfs for the Oukitel RT8 (/data/rootfs.img), built from
# Droidian's generic arm64 rootfs. Milestone 1: Droidian's own session on our
# kernel and Android 14 image, with SSH and the boot fallback.

on:
  workflow_dispatch:
  push:
    paths:
      - 'rt8/rootfs/**'
      - '.github/workflows/rt8-rootfs.yml'

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip file e2fsprogs android-sdk-libsparse-utils pigz

      - name: Download Droidian's generic arm64 rootfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest release; the API 33 (Android 13 vendor) generic Phosh zip is
          # the closest to the RT8's Android 14 vendor.
          gh release view --repo droidian-images/droidian --json tagName,assets \
            -q '.tagName, (.assets[].name)' | tee assets.txt
          name=$(grep -E 'phosh-phone-rootfs-api33-arm64.*\.zip$' assets.txt | head -1)
          [ -n "$name" ] || { echo "::error::no api33 arm64 rootfs zip in the latest Droidian release"; exit 1; }
          echo "::notice title=Droidian base::$name"
          gh release download --repo droidian-images/droidian "$(head -1 assets.txt)" -p "$name" -D dl
          ls -l dl

      - name: Build rootfs.img
        run: |
          sudo rt8/rootfs/build-rootfs.sh dl/*.zip out
          sudo chown -R "$USER" out
          cat out/report.txt

      - name: Compress
        run: |
          cd out
          pigz -6 rootfs.img
          sha256sum rootfs.img.gz | tee rootfs.img.gz.sha256
          echo "::notice title=rt8 rootfs::$(ls -l rootfs.img.gz) sha256 $(cut -c1-16 rootfs.img.gz.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-rt8-rootfs
          path: |
            out/rootfs.img.gz
            out/rootfs.img.gz.sha256
            out/report.txt
          compression-level: 0
